name: Build Apple Music APK

on:
  push:
    branches: [ '*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Build APK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if ! ls "$ANDROID_SDK_ROOT"/build-tools/* >/dev/null 2>&1 || ! ls "$ANDROID_SDK_ROOT"/platforms/android-*/android.jar >/dev/null 2>&1; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          fi
          make all

      - name: Upload Direct APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Music-APK
          path: build/Apple-Music.apk
          if-no-files-found: error
          retention-days: 90
